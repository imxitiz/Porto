name: Release Browser Extension

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Extract Extension Version
        id: package-version
        run: |
          CHROME_VERSION=$(grep '"version":' public/manifest.chrome.json | cut -d'"' -f4)
          FIREFOX_VERSION=$(grep '"version":' public/manifest.firefox.json | cut -d'"' -f4)
          COMBINED_VERSION="c${CHROME_VERSION}-f${FIREFOX_VERSION}"
          echo "chrome_version=$CHROME_VERSION" >> $GITHUB_OUTPUT
          echo "firefox_version=$FIREFOX_VERSION" >> $GITHUB_OUTPUT
          echo "combined_version=$COMBINED_VERSION" >> $GITHUB_OUTPUT
      
      - name: Run packaging script
        run: ./release-package.sh
        
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./porto-chrome.zip
            ./porto-firefox.xpi
          tag_name: v-${{ steps.package-version.outputs.combined_version }}